<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テニスコート空き状況カレンダー</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon-32.png">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <meta name="theme-color" content="#0a9c4a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="コート空き状況">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f4f6f8;
            --bg-elevated: #ffffff;
            --text-primary: #12151a;
            --text-secondary: #6b7280;
            --text-tertiary: #9aa1ab;
            --border-color: #e7e9ec;
            --accent: #0e9f6e;
            --accent-strong: #0a7a54;
            --accent-soft: rgba(14, 159, 110, 0.12);
            --success: #16a34a;
            --amber: #d97706;
            --amber-soft: rgba(217, 119, 6, 0.12);
            --danger: #e11d48;
            --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04);
            --shadow-md: 0 4px 16px rgba(16, 24, 40, 0.06);
            --shadow-lg: 0 12px 32px rgba(16, 24, 40, 0.09);
            --heat-0: transparent;
            --heat-1: rgba(14, 159, 110, 0.12);
            --heat-2: rgba(14, 159, 110, 0.26);
            --heat-3: rgba(14, 159, 110, 0.44);
            --heat-4: rgba(14, 159, 110, 0.68);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0b0d10;
                --bg-secondary: #14171b;
                --bg-elevated: #191d22;
                --text-primary: #f2f3f5;
                --text-secondary: #9aa1ab;
                --text-tertiary: #6b7280;
                --border-color: #24282e;
                --accent: #22c07d;
                --accent-strong: #34d399;
                --accent-soft: rgba(34, 192, 125, 0.16);
                --success: #34d399;
                --amber: #f59e0b;
                --amber-soft: rgba(245, 158, 11, 0.14);
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.35);
                --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.45);
                --heat-1: rgba(34, 192, 125, 0.14);
                --heat-2: rgba(34, 192, 125, 0.28);
                --heat-3: rgba(34, 192, 125, 0.46);
                --heat-4: rgba(34, 192, 125, 0.7);
            }
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        .shell {
            max-width: 1180px;
            margin: 0 auto;
            padding: 28px 24px 140px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 22px;
            align-items: start;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: sticky;
            top: 24px;
        }

        @media (max-width: 900px) {
            .shell {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
            }
        }

        .side-card {
            padding: 16px;
        }

        .side-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-tertiary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 9px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .stat-value {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.2px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #4fd869, #0a9c4a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: var(--shadow-md);
            flex-shrink: 0;
        }

        h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .header-subtitle {
            color: var(--text-secondary);
            font-size: 12.5px;
            margin-top: 2px;
        }

        .notice-banner {
            background-color: var(--amber-soft);
            border: 1px solid rgba(217, 119, 6, 0.28);
            color: var(--amber);
            border-radius: 12px;
            padding: 11px 14px;
            font-size: 12px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 500;
        }

        .notify-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .notify-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: white;
            border: none;
            padding: 11px 22px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .notify-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .notify-btn:disabled {
            background: var(--bg-secondary);
            color: var(--text-tertiary);
            box-shadow: none;
            cursor: default;
        }

        .subscribe-panel {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            font-size: 12.5px;
        }

        .subscribe-panel code {
            background: var(--accent-soft);
            color: var(--accent-strong);
            padding: 1px 6px;
            border-radius: 5px;
            font-weight: 600;
        }

        .subscribe-panel textarea {
            width: 100%;
            height: 84px;
            margin-top: 8px;
            font-family: ui-monospace, monospace;
            font-size: 10.5px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px;
        }

        .card {
            background-color: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
        }

        .calendar-container {
            padding: 20px;
            margin-bottom: 18px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .calendar-title {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.2px;
        }

        .calendar-nav {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .segmented {
            display: flex;
            background-color: var(--bg-secondary);
            border-radius: 10px;
            padding: 3px;
            gap: 2px;
        }

        .segmented .btn {
            border: none;
            background: transparent;
            box-shadow: none;
            padding: 6px 12px;
        }

        .segmented .btn:hover {
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        .btn {
            padding: 7px 13px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            border-radius: 9px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.12s ease, color 0.12s ease;
        }

        .btn:hover {
            background-color: var(--accent-soft);
            color: var(--accent-strong);
        }

        .facility-select {
            max-width: 170px;
            cursor: pointer;
            border-radius: 9px;
        }

        @media (max-width: 560px) {
            .calendar-header {
                flex-direction: column;
                align-items: stretch;
            }
            .calendar-nav {
                flex-wrap: wrap;
            }
            .facility-select {
                max-width: none;
                flex: 1 1 100%;
            }
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 8px;
        }

        .weekday {
            text-align: center;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--text-tertiary);
            padding: 6px 0;
            text-transform: uppercase;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 6px;
        }

        .day {
            position: relative;
            min-width: 0;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            border-radius: 11px;
            background-color: var(--bg-primary);
            cursor: pointer;
            padding: 4px;
            text-align: center;
            min-height: 62px;
            overflow: hidden;
            transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
        }

        .day-star {
            position: absolute;
            top: 3px;
            right: 5px;
            font-size: 10px;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25));
        }

        .fav-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 4px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        .fav-row:last-child {
            border-bottom: none;
        }

        .fav-row input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }

        .facility-section.favorite {
            border-left: 3px solid #f5b300;
            padding-left: 10px;
            margin-left: -3px;
        }

        .fav-star-icon {
            color: #f5b300;
        }

        .day:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
        }

        .day.other-month {
            visibility: hidden;
        }

        .day.past {
            opacity: 0.35;
            cursor: default;
        }

        .day.past:hover {
            transform: none;
            box-shadow: none;
        }

        .day.heat-1 { background-color: var(--heat-1); }
        .day.heat-2 { background-color: var(--heat-2); }
        .day.heat-3 { background-color: var(--heat-3); border-color: transparent; }
        .day.heat-4 { background-color: var(--heat-4); border-color: transparent; }
        .day.heat-3 .day-count, .day.heat-4 .day-count { color: #ffffff; }
        .day.heat-3 .day-number, .day.heat-4 .day-number { color: #ffffff; }
        .day.heat-3 .day-count-label, .day.heat-4 .day-count-label { color: rgba(255,255,255,0.85); }

        .day-number {
            font-size: 12.5px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .day-count {
            font-size: 15px;
            font-weight: 800;
            color: var(--accent-strong);
        }

        .day-count.zero {
            color: var(--text-tertiary);
            font-size: 10px;
            font-weight: 600;
        }

        .day-count.unknown {
            color: var(--text-tertiary);
            font-size: 12px;
        }

        .day-count-label {
            font-size: 9px;
            color: var(--text-tertiary);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(10, 12, 15, 0.55);
            backdrop-filter: blur(2px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-elevated);
            border-radius: 18px;
            padding: 24px;
            max-width: 480px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .facility-section {
            margin-bottom: 18px;
        }

        .facility-name {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .time-slot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 12px;
            background-color: var(--bg-secondary);
            border-radius: 9px;
            margin-bottom: 6px;
            font-size: 12.5px;
            border-left: 3px solid var(--accent);
        }

        .no-data {
            color: var(--text-tertiary);
            font-size: 12.5px;
            text-align: center;
        }

        .activity-section {
            padding: 18px 20px;
        }

        .activity-title {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-height: 280px;
            overflow-y: auto;
        }

        .activity-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 4px;
            border-bottom: 1px solid var(--border-color);
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent);
            margin-top: 5px;
            flex-shrink: 0;
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .activity-text {
            font-size: 12.5px;
            font-weight: 600;
        }

        .activity-time {
            font-size: 10.5px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        .footer {
            background-color: var(--bg-elevated);
            border-top: 1px solid var(--border-color);
            padding: 14px 20px;
            text-align: center;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            backdrop-filter: blur(10px);
        }

        .footer-content {
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .footer-text {
            font-size: 11.5px;
            color: var(--text-secondary);
        }

        .footer-button {
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: white;
            padding: 9px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            box-shadow: var(--shadow-md);
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="main">
            <header>
                <div class="header-icon">🎾</div>
                <div>
                    <h1>テニスコート空き状況カレンダー</h1>
                    <p class="header-subtitle">東京都立公園を自動監視中</p>
                </div>
            </header>

            <div class="notice-banner" id="noticeBanner">
                実データを取得中です...
            </div>

            <div class="notify-bar">
                <button class="notify-btn" id="notifyBtn">🔔 新規空きの通知を有効にする</button>
            </div>

            <div class="subscribe-panel" id="subscribePanel" style="display:none;">
                通知の設定が完了しました。以下の内容をコピーして、GitHubリポジトリの Secret
                <code>PUSH_SUBSCRIPTION</code> に貼り付けてください（初回のみ・1人分のみ対応）。
                <textarea id="subscribeText" readonly></textarea>
                <button class="btn" id="copySubscribeBtn">コピーする</button>
            </div>

            <div class="calendar-container card">
                <div class="calendar-header">
                    <h2 class="calendar-title" id="calendarTitle">-</h2>
                    <div class="calendar-nav">
                        <select class="btn facility-select" id="facilityFilter">
                            <option value="all">全施設</option>
                            <option value="favorites">⭐ お気に入り</option>
                        </select>
                        <button class="btn" id="editFavoritesBtn">⭐ お気に入り</button>
                        <div class="segmented">
                            <button class="btn" id="prevMonth">← 前月</button>
                            <button class="btn" id="nextMonth">次月 →</button>
                        </div>
                    </div>
                </div>

                <div class="weekdays">
                    <div class="weekday">日</div>
                    <div class="weekday">月</div>
                    <div class="weekday">火</div>
                    <div class="weekday">水</div>
                    <div class="weekday">木</div>
                    <div class="weekday">金</div>
                    <div class="weekday">土</div>
                </div>

                <div class="days" id="calendarDays">
                    <p class="no-data">読み込み中...</p>
                </div>
            </div>
        </div>

        <aside class="sidebar">
            <div class="side-card card">
                <div class="side-title">ステータス</div>
                <div class="stat-row"><span class="stat-label">監視ステータス</span><span class="stat-value" id="monitoringStatus">🟢</span></div>
                <div class="stat-row"><span class="stat-label">最終チェック</span><span class="stat-value" id="lastCheckTime" style="font-size:12.5px;">-</span></div>
                <div class="stat-row"><span class="stat-label">今月の空き枠合計</span><span class="stat-value" id="monthTotal">-</span></div>
            </div>

            <div class="side-card card activity-section">
                <div class="activity-title">📋 最近見つかった空き</div>
                <div class="activity-list" id="activityList">
                    <p class="no-data">読み込み中...</p>
                </div>
            </div>
        </aside>
    </div>

    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle"></h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="modal" id="favoritesModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">⭐ お気に入り施設の編集</h3>
                <button class="modal-close" id="favoritesModalClose">&times;</button>
            </div>
            <label class="fav-row" style="border-bottom:2px solid var(--border-color); margin-bottom:6px;">
                <input type="checkbox" id="notifyFavoritesOnlyCheckbox">
                <span>お気に入りの新規空きだけ通知する（オフなら全施設を通知）</span>
            </label>
            <div id="favoritesList"></div>
            <button class="notify-btn" id="saveFavoritesBtn" style="width:100%; margin-top:14px;">保存する</button>
            <p class="no-data" id="favoritesSaveStatus" style="margin-top:8px;"></p>
        </div>
    </div>

    <div class="footer">
        <div class="footer-content">
            <div class="footer-text">💡 空きが見つかったら公式サイトで予約してください</div>
            <a href="https://kouen.sports.metro.tokyo.lg.jp/web/" target="_blank" rel="noopener" class="footer-button">
                予約ページを開く ↗
            </a>
        </div>
    </div>

    <script>
        let viewDate = new Date();
        let fullData = null;
        let selectedFacilityId = 'all';

        function pad(n) { return String(n).padStart(2, '0'); }
        function dateKey(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }

        // --- お気に入り（サーバー側KVで共有。localStorageは初回表示を速くするためのキャッシュ） ---
        const FAVORITES_API_URL = '/api/favorites';
        const FAVORITES_API_TOKEN = 'Gxf7uuMliEh1Nd-f7fGx8GwJKQNdiKcM';

        function loadFavoritesCache() {
            try {
                const cached = JSON.parse(localStorage.getItem('favoritesCache') || 'null');
                if (cached) return { facilityIds: cached.facilityIds || [], notifyFavoritesOnly: !!cached.notifyFavoritesOnly };
            } catch (e) { /* ignore */ }
            return { facilityIds: [], notifyFavoritesOnly: false };
        }

        function saveFavoritesCache(data) {
            try {
                localStorage.setItem('favoritesCache', JSON.stringify(data));
            } catch (e) { /* ignore */ }
        }

        let { facilityIds: initialFavIds, notifyFavoritesOnly } = loadFavoritesCache();
        let favorites = new Set(initialFavIds);

        function isFavorite(facilityId) {
            return favorites.has(facilityId);
        }

        async function syncFavoritesFromServer() {
            try {
                const res = await fetch(FAVORITES_API_URL);
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'unknown error');
                favorites = new Set(data.facilityIds || []);
                notifyFavoritesOnly = Boolean(data.notifyFavoritesOnly);
                saveFavoritesCache({ facilityIds: [...favorites], notifyFavoritesOnly });
                renderCalendar(viewDate.getFullYear(), viewDate.getMonth());
            } catch (e) {
                console.error('お気に入りの取得に失敗（ローカルのキャッシュを使用）:', e.message);
            }
        }

        async function saveFavoritesToServer(facilityIds, notifyOnly) {
            const res = await fetch(FAVORITES_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Favorites-Token': FAVORITES_API_TOKEN },
                body: JSON.stringify({ facilityIds, notifyFavoritesOnly: notifyOnly })
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'unknown error');
            favorites = new Set(data.facilityIds || []);
            notifyFavoritesOnly = Boolean(data.notifyFavoritesOnly);
            saveFavoritesCache({ facilityIds: [...favorites], notifyFavoritesOnly });
        }

        function dayHasFavoriteAvailability(dayFacilities) {
            if (!dayFacilities) return false;
            return dayFacilities.some(f => isFavorite(f.facilityId) && f.timeSlots.some(s => s.available));
        }

        function filterFacilities(dayFacilities) {
            if (!dayFacilities) return [];
            if (selectedFacilityId === 'all') return dayFacilities;
            if (selectedFacilityId === 'favorites') return dayFacilities.filter(f => isFavorite(f.facilityId));
            return dayFacilities.filter(f => f.facilityId === selectedFacilityId);
        }

        function countAvailable(dayFacilities) {
            return filterFacilities(dayFacilities).reduce((sum, f) => sum + f.timeSlots.filter(s => s.available).length, 0);
        }

        // 空きが少ない（貴重な）日ほど濃く、余裕がある日ほど薄く表示する
        function heatTier(count) {
            if (count <= 0) return 0;
            if (count <= 5) return 4;
            if (count <= 10) return 3;
            if (count <= 20) return 2;
            return 1;
        }

        function populateFacilityFilter() {
            const select = document.getElementById('facilityFilter');
            select.innerHTML = '<option value="all">全施設</option><option value="favorites">⭐ お気に入り</option>';
            fullData.facilities.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.id;
                opt.textContent = f.name;
                select.appendChild(opt);
            });
            select.value = selectedFacilityId;
        }

        function populateFavoritesModal() {
            const list = document.getElementById('favoritesList');
            list.innerHTML = fullData.facilities.map(f => `
                <label class="fav-row">
                    <input type="checkbox" value="${f.id}" ${favorites.has(f.id) ? 'checked' : ''}>
                    <span>${f.name}</span>
                </label>
            `).join('');
            document.getElementById('notifyFavoritesOnlyCheckbox').checked = notifyFavoritesOnly;
            document.getElementById('favoritesSaveStatus').textContent = '';
        }

        async function loadData() {
            try {
                const res = await fetch(`/data/availability.json?t=${Date.now()}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                fullData = await res.json();

                document.getElementById('lastCheckTime').textContent = new Date(fullData.generatedAt).toLocaleString('ja-JP');
                document.getElementById('monitoringStatus').textContent = '🟢';

                const dates = Object.keys(fullData.days).sort();
                const banner = document.getElementById('noticeBanner');
                if (dates.length > 0) {
                    const rangeStart = new Date(dates[0]).toLocaleDateString('ja-JP', { month: 'long', day: 'numeric' });
                    const rangeEnd = new Date(dates[dates.length - 1]).toLocaleDateString('ja-JP', { month: 'long', day: 'numeric' });
                    banner.textContent = `実際の空き状況データです（${rangeStart}〜${rangeEnd}分を1時間ごとに取得。それ以外の日付は未取得です）`;
                } else {
                    banner.textContent = '⚠️ データがまだ取得できていません';
                }

                populateFacilityFilter();
                renderCalendar(viewDate.getFullYear(), viewDate.getMonth());
            } catch (e) {
                document.getElementById('monitoringStatus').textContent = '🔴';
                document.getElementById('calendarDays').innerHTML = `<p class="no-data">データ取得に失敗しました: ${e.message}</p>`;
            }
        }

        function renderCalendar(year, month) {
            const days = fullData ? fullData.days : {};
            const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
            document.getElementById('calendarTitle').textContent = `${year}年${monthNames[month]}`;

            const firstDay = new Date(year, month, 1);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startingDayOfWeek = firstDay.getDay();

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const grid = document.getElementById('calendarDays');
            grid.innerHTML = '';

            let monthTotal = 0;

            for (let i = 0; i < startingDayOfWeek; i++) {
                const empty = document.createElement('div');
                empty.className = 'day other-month';
                grid.appendChild(empty);
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const key = dateKey(year, month, d);
                const hasData = Object.prototype.hasOwnProperty.call(days, key);
                const dayFacilities = filterFacilities(days[key] || []);
                const count = countAvailable(dayFacilities);
                if (hasData) monthTotal += count;
                const cellDate = new Date(year, month, d);
                const isPast = cellDate < today;

                const el = document.createElement('div');
                const tier = hasData && !isPast ? heatTier(count) : 0;
                el.className = 'day' + (isPast ? ' past' : '') + (tier > 0 ? ` heat-${tier}` : '');

                if (hasData && !isPast && favorites.size > 0 && dayHasFavoriteAvailability(days[key])) {
                    const star = document.createElement('div');
                    star.className = 'day-star';
                    star.textContent = '⭐';
                    el.appendChild(star);
                }

                const num = document.createElement('div');
                num.className = 'day-number';
                num.textContent = d;

                const countEl = document.createElement('div');
                if (!hasData) {
                    countEl.className = 'day-count unknown';
                    countEl.textContent = '-';
                } else {
                    countEl.className = 'day-count' + (count === 0 ? ' zero' : '');
                    countEl.textContent = count === 0 ? '空きなし' : count;
                }

                el.appendChild(num);
                el.appendChild(countEl);
                if (hasData && count > 0) {
                    const label = document.createElement('div');
                    label.className = 'day-count-label';
                    label.textContent = '枠';
                    el.appendChild(label);
                }

                if (hasData) {
                    el.addEventListener('click', () => showDetails(key, cellDate, dayFacilities));
                }
                grid.appendChild(el);
            }

            document.getElementById('monthTotal').textContent = monthTotal;
        }

        function showDetails(key, date, dayFacilities) {
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('modalTitle').textContent = date.toLocaleDateString('ja-JP', options);

            const modalBody = document.getElementById('modalBody');
            const sections = dayFacilities
                .map(f => {
                    const openSlots = f.timeSlots.filter(s => s.available);
                    if (openSlots.length === 0) return '';
                    const fav = isFavorite(f.facilityId);
                    return `
                        <div class="facility-section${fav ? ' favorite' : ''}">
                            <div class="facility-name">${fav ? '<span class="fav-star-icon">⭐</span> ' : ''}${f.facility}</div>
                            ${openSlots.map(s => `
                                <div class="time-slot"><span>${s.time}</span><span style="color:var(--accent-strong)">✓ 空き</span></div>
                            `).join('')}
                        </div>
                    `;
                })
                .filter(html => html !== '')
                .join('');

            modalBody.innerHTML = sections || '<p class="no-data">この日は空きがありません</p>';
            document.getElementById('detailModal').classList.add('active');
        }

        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('detailModal').classList.remove('active');
        });
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') e.target.classList.remove('active');
        });

        document.getElementById('prevMonth').addEventListener('click', () => {
            viewDate.setMonth(viewDate.getMonth() - 1);
            renderCalendar(viewDate.getFullYear(), viewDate.getMonth());
        });
        document.getElementById('nextMonth').addEventListener('click', () => {
            viewDate.setMonth(viewDate.getMonth() + 1);
            renderCalendar(viewDate.getFullYear(), viewDate.getMonth());
        });
        document.getElementById('facilityFilter').addEventListener('change', (e) => {
            selectedFacilityId = e.target.value;
            renderCalendar(viewDate.getFullYear(), viewDate.getMonth());
        });

        document.getElementById('editFavoritesBtn').addEventListener('click', () => {
            if (!fullData) return;
            populateFavoritesModal();
            document.getElementById('favoritesModal').classList.add('active');
        });
        document.getElementById('favoritesModalClose').addEventListener('click', () => {
            document.getElementById('favoritesModal').classList.remove('active');
        });
        document.getElementById('favoritesModal').addEventListener('click', (e) => {
            if (e.target.id === 'favoritesModal') e.target.classList.remove('active');
        });
        document.getElementById('saveFavoritesBtn').addEventListener('click', async () => {
            const checked = [...document.querySelectorAll('#favoritesList input:checked')].map(el => el.value);
            const notifyOnly = document.getElementById('notifyFavoritesOnlyCheckbox').checked;
            const status = document.getElementById('favoritesSaveStatus');
            const btn = document.getElementById('saveFavoritesBtn');

            btn.disabled = true;
            status.textContent = '保存中...';
            try {
                await saveFavoritesToServer(checked, notifyOnly);
                document.getElementById('favoritesModal').classList.remove('active');
                renderCalendar(viewDate.getFullYear(), viewDate.getMonth());
            } catch (e) {
                status.textContent = '❌ 保存に失敗しました: ' + e.message;
            } finally {
                btn.disabled = false;
            }
        });

        // --- アクティビティログ ---
        function relativeTime(isoString) {
            const diffMs = Date.now() - new Date(isoString).getTime();
            const minutes = Math.floor(diffMs / 60000);
            if (minutes < 1) return 'たった今';
            if (minutes < 60) return `${minutes}分前`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}時間前`;
            const days = Math.floor(hours / 24);
            return `${days}日前`;
        }

        function formatActivityDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00+09:00');
            const weekday = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
            return `${d.getMonth() + 1}/${d.getDate()}(${weekday})`;
        }

        async function loadActivityLog() {
            const list = document.getElementById('activityList');
            try {
                const res = await fetch(`/data/activity-log.json?t=${Date.now()}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const log = await res.json();

                if (!log || log.length === 0) {
                    list.innerHTML = '<p class="no-data">まだ新しい空きは見つかっていません</p>';
                    return;
                }

                list.innerHTML = log.slice(0, 30).map(entry => `
                    <div class="activity-item">
                        <div class="activity-dot"></div>
                        <div>
                            <div class="activity-text">${formatActivityDate(entry.date)} ${entry.time} ${entry.facility}</div>
                            <div class="activity-time">${relativeTime(entry.detectedAt)}に検知</div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                list.innerHTML = `<p class="no-data">読み込みに失敗しました: ${e.message}</p>`;
            }
        }

        loadData();
        loadActivityLog();
        syncFavoritesFromServer();
        setInterval(loadData, 60 * 60 * 1000);
        setInterval(loadActivityLog, 60 * 60 * 1000);

        // --- PWA installability + Web Push ---
        const VAPID_PUBLIC_KEY = 'BNpuNfvpkX-8XMwnvBU4K7cykGDCEh6uSR7IwtKEfQJh4E-qus2N1PigdmjcnPIs-G7bvgO_2dNjKSQS9FRgVI8';

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = atob(base64);
            return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
        }

        function isIos() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent);
        }

        function isStandalone() {
            return window.navigator.standalone === true
                || window.matchMedia('(display-mode: standalone)').matches;
        }

        async function setupPush() {
            const btn = document.getElementById('notifyBtn');
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                if (isIos() && !isStandalone()) {
                    btn.textContent = '📲 まずホーム画面に追加してください';
                    btn.title = 'Safariの共有ボタン→「ホーム画面に追加」を実行後、ホーム画面のアイコンから開き直してください（iOS 16.4以降が必要です）';
                    btn.addEventListener('click', () => {
                        alert('iPhoneでは通知を使う前に、Safariの共有ボタンから「ホーム画面に追加」し、ホーム画面のアイコンから開き直す必要があります（iOS 16.4以降）。');
                    });
                } else {
                    btn.textContent = '❌ このブラウザは通知に対応していません';
                    btn.disabled = true;
                }
                return;
            }

            try {
                const registration = await navigator.serviceWorker.register('/sw.js');

                const existing = await registration.pushManager.getSubscription();
                if (existing) {
                    btn.textContent = '🔔 通知は有効です';
                    btn.disabled = true;
                    return;
                }

                btn.addEventListener('click', async () => {
                    const permission = await Notification.requestPermission();
                    if (permission !== 'granted') {
                        alert('通知が許可されませんでした');
                        return;
                    }

                    const subscription = await registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
                    });

                    btn.textContent = '🔔 通知は有効です';
                    btn.disabled = true;

                    const panel = document.getElementById('subscribePanel');
                    const textarea = document.getElementById('subscribeText');
                    textarea.value = JSON.stringify(subscription);
                    panel.style.display = 'block';
                });
            } catch (e) {
                console.error('push setup failed', e);
            }
        }

        document.getElementById('copySubscribeBtn').addEventListener('click', () => {
            const textarea = document.getElementById('subscribeText');
            textarea.select();
            navigator.clipboard.writeText(textarea.value).catch(() => {
                document.execCommand('copy');
            });
        });

        setupPush();
    </script>
</body>
</html>
