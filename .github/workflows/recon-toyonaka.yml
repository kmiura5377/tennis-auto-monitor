name: Recon Toyonaka (temporary)

on:
  push:
    branches: [recon-toyonaka]
    paths: ['recon/recon-toyonaka.js', '.github/workflows/recon-toyonaka.yml', 'recon/steps.json']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node recon/recon-toyonaka.js
      - name: Commit recon output
        run: |
          git config user.name "tennis-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f recon/out
          git commit -m "Recon output ($(date -u +%Y-%m-%dT%H:%M:%SZ))" || exit 0
          git push origin HEAD:recon-toyonaka
