name: Tennis Court Availability Scraper

on:
  schedule:
    # UTC time, once per hour. JST 6:00-23:59 = UTC 21:00-23:59 (prev day) + UTC 00:00-14:59
    - cron: '0 21-23,0-14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: npm run scrape

      - name: Commit updated data if changed
        run: |
          git config user.name "tennis-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- data/availability.json data/activity-log.json)" ]; then
            echo "No changes to data files"
            exit 0
          fi

          git add data/availability.json data/activity-log.json
          git commit -m "Update availability data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

          # スクレイピングに時間がかかる間に他の変更がpushされていることがあるため、
          # 先に進んでいたら一度だけrebaseして再試行する
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto latest main (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
          done

          echo "push failed after retries"
          exit 1
