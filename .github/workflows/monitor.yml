name: Tennis Court Availability Scraper

on:
  schedule:
    # UTC time, every 30 minutes. JST 6:00-23:59 = UTC 21:00-23:59 (prev day) + UTC 00:00-14:59
    # 毎時0分・30分はGitHub全体で予約実行が集中し、遅延・スキップされやすいため7分・37分にずらしている
    - cron: '7,37 21-23,0-14 * * *'
  workflow_dispatch:
    inputs:
      test_push_only:
        description: '自分(me)宛にテスト通知だけ送る（実際のスクレイピングは行わない）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # スクレイピング(約10分)＋次の実行までの待ち時間(30分間隔になるまで)を含めて、
    # 余裕を持たせた上限。GitHub Actions側の不具合等で詰まったままにならないようにする。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # GitHubの定期実行(schedule)は間引かれて数時間空くことがあるため、
      # 「各実行の最後に次の実行を自分で起動する」連鎖を主にし、scheduleは連鎖が
      # 途切れた時の再始動用に残している。連鎖が生きているのにscheduleも動いて
      # 二重に実行しないよう、直近20分以内にデータが更新されていればscheduleの実行は何もしない。
      - name: Guard against duplicate runs
        id: guard
        run: |
          echo "START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f data/availability.json ]; then
            gen=$(jq -r '.generatedAt' data/availability.json)
            age=$(( $(date +%s) - $(date -d "$gen" +%s) ))
            if [ "$age" -lt 1200 ]; then
              skip=true
              echo "データは${age}秒前に更新済みのため、この実行は何もしない"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        if: steps.guard.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        if: steps.guard.outputs.skip != 'true'
        env:
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          FAVORITES_API_TOKEN: ${{ secrets.FAVORITES_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TEST_PUSH_ONLY: ${{ github.event.inputs.test_push_only }}
        run: npm run scrape

      - name: Commit updated data if changed
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -x
          git config user.name "tennis-monitor-bot"
          git config user.email "actions@users.noreply.github.com"

          cp data/availability.json /tmp/availability.json
          cp data/activity-log.json /tmp/activity-log.json
          cp data/notify-debug.json /tmp/notify-debug.json

          # スクレイピングに15〜30分かかる間に他の実行がpushしていることがあるため、
          # 毎回リモートの最新状態から作り直してからコミット・pushする（stale baseを避ける）
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            cp /tmp/availability.json data/availability.json
            cp /tmp/activity-log.json data/activity-log.json
            cp /tmp/notify-debug.json data/notify-debug.json

            if [ -z "$(git status --porcelain -- data/availability.json data/activity-log.json data/notify-debug.json)" ]; then
              echo "No changes to data files"
              exit 0
            fi

            git add data/availability.json data/activity-log.json data/notify-debug.json
            git commit -m "Update availability data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

            if git push origin main; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi

            echo "push failed on attempt $attempt, retrying after backoff"
            sleep $((attempt * 5))
          done

          echo "push failed after retries"
          exit 1

      # 次の実行を自分で起動する（30分間隔になるまで待ってから）。
      # workflow_dispatch はGITHUB_TOKENからでも起動できる。日本時間の深夜(0〜5時)は
      # 起動せず連鎖を止め、朝6時台のscheduleで再開させる。
      - name: Wait and trigger next run
        if: always() && steps.guard.outputs.skip != 'true' && github.event.inputs.test_push_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          elapsed=$(( $(date +%s) - START_EPOCH ))
          wait=$(( 1800 - elapsed ))
          if [ "$wait" -gt 0 ]; then
            echo "次の実行まで${wait}秒待つ"
            sleep "$wait"
          fi
          hour=$(TZ=Asia/Tokyo date +%H)
          if [ "$((10#$hour))" -lt 6 ]; then
            echo "深夜(日本時間${hour}時)のため次の実行は起動しない"
            exit 0
          fi
          gh workflow run monitor.yml --ref main
