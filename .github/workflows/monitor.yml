name: Tennis Court Availability Scraper

on:
  schedule:
    # UTC time, every 30 minutes. JST 6:00-23:59 = UTC 21:00-23:59 (prev day) + UTC 00:00-14:59
    - cron: '0,30 21-23,0-14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          FAVORITES_API_TOKEN: ${{ secrets.FAVORITES_API_TOKEN }}
        run: npm run scrape

      - name: Commit updated data if changed
        run: |
          set -x
          git config user.name "tennis-monitor-bot"
          git config user.email "actions@users.noreply.github.com"

          cp data/availability.json /tmp/availability.json
          cp data/activity-log.json /tmp/activity-log.json

          # スクレイピングに15〜30分かかる間に他の実行がpushしていることがあるため、
          # 毎回リモートの最新状態から作り直してからコミット・pushする（stale baseを避ける）
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            cp /tmp/availability.json data/availability.json
            cp /tmp/activity-log.json data/activity-log.json

            if [ -z "$(git status --porcelain -- data/availability.json data/activity-log.json)" ]; then
              echo "No changes to data files"
              exit 0
            fi

            git add data/availability.json data/activity-log.json
            git commit -m "Update availability data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

            if git push origin main; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi

            echo "push failed on attempt $attempt, retrying after backoff"
            sleep $((attempt * 5))
          done

          echo "push failed after retries"
          exit 1
