name: Tennis Court Monitor

on:
  schedule:
    # UTC time, once per hour. JST 6:00-23:59 = UTC 21:00-23:59 (prev day) + UTC 00:00-14:59
    - cron: '0 21-23,0-14 * * *'
  workflow_dispatch: {}

jobs:
  call-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Call availability check endpoint
        run: curl -fsS "https://tennis-auto-monitor.vercel.app/api/availability"
