name: Tennis Court Availability Scraper

on:
  schedule:
    # UTC time, once per hour. JST 6:00-23:59 = UTC 21:00-23:59 (prev day) + UTC 00:00-14:59
    - cron: '0 21-23,0-14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
        run: npm run scrape

      - name: Commit updated data if changed
        run: |
          git config user.name "tennis-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data/availability.json; then
            git add data/availability.json
            git commit -m "Update availability data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          else
            echo "No changes to data/availability.json"
          fi
